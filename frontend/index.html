<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta content="light dark" name="color-scheme" />
    <link href="/favicon.svg" rel="icon" type="image/svg+xml" />
    <link
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      rel="stylesheet"
    />
    <title>mockx - 모의 증권 거래소</title>
    <script>
      // 첫 화면이 다른 테마로 깜빡이지 않게 렌더링 전에 테마를 정한다. 규칙은 src/theme/theme.ts와 같다
      ;(function () {
        var stored = null
        try {
          stored = localStorage.getItem('mockx.theme')
        } catch (e) {}
        var system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = stored === 'light' || stored === 'dark' ? stored : system
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
