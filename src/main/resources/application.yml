spring:
  application:
    name: mockx
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 스키마는 Flyway가 관리하고, Hibernate는 엔티티와 일치하는지만 검사한다
    properties:
      hibernate:
        jdbc:
          time_zone: UTC # Instant를 DATETIME(6)에 UTC로 저장한다
  jackson:
    deserialization:
      accept-float-as-int: false
    datatype:
      enum:
        fail-on-numbers-for-enums: true # 숫자로 들어오면 역직렬화 비허용
    mapper:
      accept-case-insensitive-enums: true # enum 변환 시 대소문자 무시
